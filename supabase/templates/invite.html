<!doctype html>
<html lang="ja">
<body style="margin:0;padding:24px;background:#f6f6f7;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#232425;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;padding:28px;">
    <p style="margin:0 0 20px;"><img src="{{ .SiteURL }}/icons/email-logo.png" width="110" height="24" alt="矢書（やぶみ）" style="display:block;border:0;"></p>
    <h1 style="margin:0 0 12px;font-size:20px;">矢書への招待</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.8;">矢書（ひとりで売る人のための SNS 運用ツール）に招待されました。下のボタンを押して、パスワードを決めると使い始められます。</p>
    <p style="margin:0 0 24px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/reset-password" style="display:inline-block;background:#232425;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:8px;">パスワードを決めて始める</a></p>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.7;color:#606366;">ボタンが押せないときは、次の URL をブラウザに貼り付けてください。<br><span style="word-break:break-all;">{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/reset-password</span></p>
    <p style="margin:16px 0 0;font-size:13px;line-height:1.7;color:#606366;">心当たりがない場合は、このメールを削除してください。</p>
  </div>
</body>
</html>
