<!doctype html>
<html lang="ja">
<body style="margin:0;padding:24px;background:#f2f2ee;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#1b2333;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e6e8ec;border-radius:8px;padding:28px;">
    <p style="margin:0 0 20px;font-size:18px;font-weight:bold;">矢書（やぶみ）</p>
    <h1 style="margin:0 0 12px;font-size:20px;">メールアドレスの変更の確認</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.8;">矢書に登録するメールアドレスを {{ .NewEmail }} に変える手続きを受け付けました。下のボタンを押すと変更が済みます。</p>
    <p style="margin:0 0 24px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/settings" style="display:inline-block;background:#23406e;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:6px;">変更を確定する</a></p>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.7;color:#5d6577;">ボタンが押せないときは、次の URL をブラウザに貼り付けてください。<br><span style="word-break:break-all;">{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/settings</span></p>
    <p style="margin:16px 0 0;font-size:13px;line-height:1.7;color:#5d6577;">心当たりがない場合は、このメールを削除し、念のためパスワードを変えてください。</p>
  </div>
</body>
</html>
